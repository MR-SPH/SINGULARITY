name: Feature request
description: Suggest an improvement or new feature
title: ""
labels:
  - enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an improvement to SINGULARITY.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem would this idea solve?
      placeholder: Describe the user need or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or improvement you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative approaches you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or references if available.
    validations:
      required: false
