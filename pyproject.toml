[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity-art"
version = "1.0.0"
description = "SINGULARITY: Arabic Gravitational Art Engine - An interactive black hole simulation rendered with Arabic typography"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Engineer", email = "engineer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5.0",
    "numpy>=2.0.0",
    "numba>=0.60.0",
    "pillow>=10.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
singularity = "singularity.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

